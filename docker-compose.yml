services:
  keyauth:
    build: .
    restart: always
    env_file: .env
    environment:
      DB_PATH: /data/keyauth.db
    volumes:
      - keyauth-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/meta/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  keyauth-data:
